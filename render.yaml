services:
  - type: web
    name: budgetku
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: budgetku-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: budgetku-db
